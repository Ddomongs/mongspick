<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongsPick Uploader — 인증 완료</title>
<style>
  body { font-family: Pretendard, -apple-system, sans-serif; max-width: 720px;
         margin: 40px auto; padding: 0 20px; color: #2b2f3e; }
  h1 { color: #FF8A3D; }
  code { display: block; background: #f4f4f4; padding: 12px; border-radius: 8px;
         word-break: break-all; margin: 16px 0; font-size: 15px; }
</style>
</head>
<body>
<h1>인증이 완료되었습니다</h1>
<p>아래 코드를 복사해서 실행 중인 터미널에 붙여넣어 주세요.</p>
<code id="code">(코드 없음 — 주소창의 code 파라미터가 비어 있습니다)</code>
<script>
  const code = new URLSearchParams(location.search).get("code");
  if (code) document.getElementById("code").textContent = code;
</script>
</body>
</html>
